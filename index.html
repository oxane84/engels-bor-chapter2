n value="all">Alles oefenen</option><option value="missed">Alleen eerdere fouten</option></select></div></div><button onclick="startSession()">Start oefensessie →</button></section><div id="session"></div>`}
function startSession(){let src=kind==='words'?words:stones;let a=src.filter(x=>category==='all'||x.cat===category);if($('#missed').value==='missed')a=a.filter(x=>score(x).miss>score(x).ok);if(!a.length){$('#session').innerHTML='<section class="panel">Geen kaarten gevonden voor deze selectie. Kies ‘Alles oefenen’.</section>';return}queue=random(a).slice(0,Number($('#count').value)).map(x=>({...x,dir:kind==='words'&&x.mode==='recognize'?'en-nl':direction==='mixed'?(Math.random()<.5?'en-nl':'nl-en'):direction}));idx=0;sessionCorrect=0;sessionTotal=0;card()}
function card(){clearTimeout(timer);if(idx>=queue.length){saved.completed++;persist();$('#session').innerHTML=`<section class="panel"><h2>Sessie afgerond! 🎉</h2><div class="big">${sessionCorrect}/${sessionTotal} goed</div><p>Fouten blijven bewaard voor de volgende herhaling.</p><button onclick="startSession()">Nog een ronde</button></section>`;return}let x=queue[idx];revealed=phase==='learn';checked=false;$('#session').innerHTML=`<section class="panel"><span class="pill">Kaart ${idx+1} / ${queue.length}</span><span class="pill">${esc(x.cat)}</span><div class="progress"><div style="width:${idx/queue.length*100}%"></div></div><div class="card"><div class="muted small">${x.dir==='nl-en'?'Vertaal naar het Engels':'Vertaal naar het Nederlands'}</div><div class="big">${esc(x.dir==='nl-en'?x.nl:x.en)}</div><div class="translation" id="reveal">${revealed?esc(x.dir==='nl-en'?x.en:x.nl):'••••••••'}</div><div id="timehint" class="muted small">${phase==='learn'?(seconds?'Kijk goed: het antwoord verdwijnt vanzelf.':'Klik op Verberg antwoord als je klaar bent.'):'Blind oefenen: je ziet het antwoord pas na het nakijken.'}</div><div class="buttons" id="hidebtn">${phase==='learn'?'<button class="secondary" onclick="hideAnswer()">Verberg antwoord</button>':''}</div><div id="answerarea" style="display:${phase==='learn'?'none':'block'}"><label for="answer">Typ je antwoord</label><input id="answer" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkAnswer()" placeholder="Jouw antwoord"><div class="buttons"><button onclick="checkAnswer()">Controleer</button></div></div><div id="feedback"></div></div></section>`;if(revealed&&seconds>0)timer=setTimeout(hideAnswer,seconds*1000);if(!revealed)$('#answer').focus()}
function hideAnswer(){clearTimeout(timer);if(!$('#reveal'))return;revealed=false;$('#reveal').textContent='••••••••';$('#timehint').textContent='Nu zelf typen, zonder te spieken!';$('#hidebtn').innerHTML='';$('#answerarea').style.display='block';$('#answer').focus()}
function checkAnswer(){if(checked)return;let x=queue[idx],v=$('#answer').value.trim();if(!v)return;checked=true;let ok=matches(x,v,x.dir),s=score(x);if(ok)s.ok++;else s.miss++;saved.stats[statKey(x)]=s;persist();sessionTotal++;if(ok)sessionCorrect++;$('#feedback').innerHTML=`<div class="result ${ok?'':'wrong'}"><b>${ok?'✓ Goed gedaan!':'✗ Nog niet helemaal.'}</b><p>Juiste antwoord: <b>${esc(x.dir==='nl-en'?x.en:x.nl)}</b></p>${!ok?`<p>Jij schreef: ${esc(v)}</p>`:''}</div><div class="buttons"><button onclick="idx++;card()">Volgende kaart →</button></div>`;$('#answer').disabled=true;$('#answerarea button').disabled=true}
function grammarPage(){let rules=[['1. Yes/no questions','Bij am, are, is en can komt het werkwoord vóór de persoon: Are you his brother? Can you tell me?','Bij andere werkwoorden gebruik je do/does: Do you like him? Does he have a dog?','Bij have got: Have you got two cats? Has she got history?'],['2. Negative sentences','am/is/are/can + not: I am not; he isn’t; you aren’t; I can’t.','Andere werkwoorden: do not / don’t; bij he/she/it: does not / doesn’t + hele werkwoord.','have got: haven’t got / hasn’t got.'],['3. Word order','Standaard: WIE + WERKWOORD + WAT + WAAR + WANNEER.','She has history at school on Tuesday.','We cook dinner at home every Monday.']];let qs=[['___ you his brother?','Are'],['___ he have a dog?','Does'],['Have you ___ two cats?','got'],['She ___ not walk to school.','does'],['He ___ my friend. (ontkenning)','isn’t'],['I ___ got two cats. (ontkenning)','haven’t'],['She has history ___ school on Tuesday.','at'],['___ you tell me about yourself?','Can'],['He ___ got history at two o’clock. (ontkenning)','hasn’t']];$('#app').innerHTML=`<section class="panel"><h2>Grammar — Chapter 2</h2>${rules.map(r=>`<details open><summary>${r[0]}</summary><p>${r.slice(1).join('</p><p>')}</p></details>`).join('')}</section><section class="panel"><h2>Grammatica-oefening</h2><p>Vul het ontbrekende Engelse woord in. De score verschijnt na nakijken.</p>${qs.map((q,i)=>`<div class="field" style="margin:12px 0"><label>${i+1}. ${esc(q[0])}</label><input id="g${i}" autocomplete="off" spellcheck="false"></div>`).join('')}<button onclick="checkGrammar()">Kijk grammatica na</button><div id="gresult"></div></section>`;window.grammarQs=qs}
function checkGrammar(){let q=window.grammarQs,ok=0;let lines=q.map(([prompt,answer],i)=>{let v=$('#g'+i).value,good=norm(v)===norm(answer);if(good)ok++;return `<p>${good?'✓':'✗'} ${esc(prompt)} — <b>${esc(answer)}</b>${good?'':` <span class="muted">(jij: ${esc(v)})</span>`}</p>`});$('#gresult').innerHTML=`<div class="result"><h3>${ok}/${q.length} goed</h3>${lines.join('')}</div>`}
function overview(){let cats=[...new Set(words.map(x=>x.cat))];$('#app').innerHTML=`<section class="panel"><h2>Alle lesboekwoorden</h2><p class="muted">‘Begrijpen’ = alleen Engels → Nederlands. ‘Beide’ = beide vertaalrichtingen.</p>${cats.map(c=>`<details><summary>${esc(c)} (${words.filter(x=>x.cat===c).length})</summary><table><thead><tr><th>English</th><th>Nederlands</th><th>Richting</th></tr></thead><tbody>${words.filter(x=>x.cat===c).map(x=>`<tr><td>${esc(x.en)}</td><td>${esc(x.nl)}</td><td>${x.mode==='recognize'?'Begrijpen':'Beide'}</td></tr>`).join('')}</tbody></table></details>`).join('')}</section><section class="panel"><h2>Stones</h2>${[...new Set(stones.map(x=>x.cat))].map(c=>`<details><summary>${esc(c)}</summary><table>${stones.filter(x=>x.cat===c).map(x=>`<tr><td>${esc(x.en)}</td><td>${esc(x.nl)}</td></tr>`).join('')}</table></details>`).join('')}</section>`}
function progressPage(){let learned=Object.values(saved.stats).filter(x=>x.ok>0).length,miss=Object.values(saved.stats).filter(x=>x.miss>x.ok).length;$('#app').innerHTML=`<section class="panel"><h2>Jouw voortgang</h2><p><b>${learned}</b> items minimaal één keer goed · <b>${miss}</b> items extra herhalen · <b>${saved.completed}</b> sessies afgerond</p><p>De gegevens staan alleen in deze browser op dit apparaat.</p><div class="buttons"><button class="secondary" onclick="exportProgress()">Voortgang exporteren</button><button class="secondary" onclick="if(confirm('Weet je zeker dat je alle voortgang wilt wissen?')){saved={stats:{},completed:0};persist();render()}">Voortgang wissen</button></div></section>`}
function exportProgress(){let b=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='bor-engels-voortgang.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></body></html>
